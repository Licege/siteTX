# Локальная разработка: в Docker — nginx + postgres.
# На хосте должны быть запущены:
#   - server: make start-service (9090), make start-auth (9092)
#   - site: npm start (3000)
#   - dashboard: PORT=3001 npm start (3001)
#
# server/.env для подключения к БД:
#   DB_HOST=localhost
#   DB_USER=postgres
#   DB_PASSWORD=5315
#   DB_NAME=trixolma

services:
  db:
    image: postgres:15-alpine
    container_name: trixolma_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "5315"
      POSTGRES_DB: trixolma
    restart: unless-stopped

  nginx:
    container_name: trixolma_nginx
    build: ./nginx/local
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
