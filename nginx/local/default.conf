# Прокси на процессы, запущенные на хосте (не в Docker).
# host.docker.internal — стандартный адрес хоста из контейнера (macOS / Windows / Linux).

upstream api_service {
    server host.docker.internal:9090;
}

upstream api_auth {
    server host.docker.internal:9092;
}

upstream site {
    server host.docker.internal:3000;
}

upstream dashboard {
    server host.docker.internal:3001;
}

server {
    listen 80;
    server_name pub.trixolma.localhost;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers "Authorization,Accept,Origin,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Content-Range,Range" always;
    add_header Access-Control-Allow-Methods "GET,POST,OPTIONS,PUT,DELETE,PATCH,COPY" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location ~ /api/auth {
        proxy_pass http://api_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /api {
        proxy_pass http://api_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /uploads {
        proxy_pass http://api_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://site;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

